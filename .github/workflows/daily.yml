name: ATHENA quotidien

# Trois exécutions par jour : ingestion des résultats, règlement des paris,
# nouvelles prédictions, publication du dashboard.
on:
  schedule:
    - cron: "20 5,11,17 * * *"   # 05:20 / 11:20 / 17:20 UTC
  workflow_dispatch:
    inputs:
      horizon:
        description: "Fenêtre de pronostic (jours)"
        default: "3"

concurrency:
  group: athena-write
  cancel-in-progress: false

permissions:
  contents: write
  pages: write          # le déploiement Pages est fait ici : un commit poussé
  id-token: write       # par GITHUB_TOKEN ne déclenche pas d'autre workflow

jobs:
  pipeline:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer ATHENA
        run: pip install -e .

      - name: Cache des données téléchargées
        uses: actions/cache@v4
        with:
          path: data/cache
          key: athena-cache-${{ github.run_id }}
          restore-keys: athena-cache-

      - name: Pipeline quotidien
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ATHENA_SITE_URL: ${{ vars.ATHENA_SITE_URL }}
        run: python -m athena.cli daily

      # Le rapport du run (résultats réglés, P&L, value bets) est affiché
      # directement dans l'onglet Summary du run : bien visible, sans clic.
      - name: Résumé du run (résultats & P&L)
        if: always()
        run: |
          FILE=site/data/run_summary.md
          if [ -f "$FILE" ]; then cat "$FILE" >> "$GITHUB_STEP_SUMMARY"; else
            echo "## ATHENA — exécution sans rapport" >> "$GITHUB_STEP_SUMMARY"
            echo "Le pipeline n'a pas produit de résumé (voir les logs ci-dessus)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publier les artefacts du jour
        uses: actions/upload-artifact@v4
        with:
          name: athena-publication
          path: |
            site/
            data/state/ledger.json
            data/state/predictions_history.json
          retention-days: 14

      - name: Committer les résultats
        run: |
          git config user.name "ATHENA Bot"
          git config user.email "athena-bot@users.noreply.github.com"
          git add site data/state
          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
          else
            git commit -m "chore(daily): prédictions du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      # Le commit ci-dessus est poussé avec GITHUB_TOKEN : il ne déclenche
      # aucun autre workflow (anti-récursion GitHub). On déploie donc Pages
      # directement ici, sinon le site resterait figé sur l'ancienne version.
      - name: Préparer l'artefact Pages
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Déployer le dashboard (GitHub Pages)
        id: deploy
        if: success()
        uses: actions/deploy-pages@v4
        continue-on-error: true
