[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-engine"
version = "1.0.0"
description = "ATHENA — moteur quantitatif de pronostics football (Dixon-Coles + Elo + GBM, value betting Kelly)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kabre Arthur" }]
keywords = ["betting", "football", "dixon-coles", "elo", "lightgbm", "value-betting"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
athena = "athena.cli:main"

[project.urls]
Homepage = "https://github.com/arthur12arthur/athena-betting-engine"

[tool.setuptools.packages.find]
include = ["athena*"]

[tool.setuptools.package-data]
athena = ["report/template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["data", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
